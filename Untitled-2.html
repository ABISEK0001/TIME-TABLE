<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Class Timetable</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    border-radius:12px;
    padding:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.table-responsive{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th{
    background:#007BFF;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f8f9fa;
}

tr:hover{
    background:#d6eaff;
}

@media(max-width:768px){

body{
    padding:15px;
}

.container{
    padding:10px;
}

h1{
    font-size:24px;
}

table{
    font-size:14px;
}

th,td{
    padding:8px;
}

}
</style>
</head>

<body>

<div class="container">

<h1>📅 Class Timetable</h1>

<div class="table-responsive">

<table>

<tr>
<th>Day</th>
<th>9:00 - 10:00</th>
<th>10:00 - 11:00</th>
<th>11:15 - 12:15</th>
<th>1:00 - 2:00</th>
<th>2:00 - 3:00</th>
</tr>

<tr>
<td>Monday</td>
<td>Maths</td>
<td>English</td>
<td>Python</td>
<td>DBMS</td>
<td>Lab</td>
</tr>

<tr>
<td>Tuesday</td>
<td>Java</td>
<td>Python</td>
<td>Operating System</td>
<td>AI</td>
<td>Sports</td>
</tr>

<tr>
<td>Wednesday</td>
<td>DBMS</td>
<td>Maths</td>
<td>English</td>
<td>Java</td>
<td>Lab</td>
</tr>

<tr>
<td>Thursday</td>
<td>Python</td>
<td>AI</td>
<td>Operating System</td>
<td>DBMS</td>
<td>Library</td>
</tr>

<tr>
<td>Friday</td>
<td>English</td>
<td>Maths</td>
<td>Java</td>
<td>Python</td>
<td>Seminar</td>
</tr>

</table>

</div>

</div>

</body>
</html>
