<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editable Timetable</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.buttons{
    text-align:center;
    margin-bottom:20px;
}

button{
    padding:10px 18px;
    margin:5px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#007bff;
    color:white;
    font-size:15px;
}

button:hover{
    background:#0056b3;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    background:#007bff;
    color:white;
    padding:12px;
}

td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

td[contenteditable="true"]{
    background:#fffdf2;
}

tr:nth-child(even){
    background:#f8f8f8;
}

@media(max-width:700px){
    table{
        font-size:14px;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Editable Class Timetable</h1>

<div class="buttons">
<button onclick="saveTable()">Save</button>
<button onclick="addRow()">Add Day</button>
<button onclick="deleteRow()">Delete Last Day</button>
<button onclick="resetTable()">Reset</button>
</div>

<div class="table-container">

<table id="timetable">

<tr>
<th>Day</th>
<th>9-10</th>
<th>10-11</th>
<th>11-12</th>
<th>1-2</th>
<th>2-3</th>
</tr>

<tr>
<td contenteditable="true">Monday</td>
<td contenteditable="true">Math</td>
<td contenteditable="true">English</td>
<td contenteditable="true">Science</td>
<td contenteditable="true">AI</td>
<td contenteditable="true">Lab</td>
</tr>

<tr>
<td contenteditable="true">Tuesday</td>
<td contenteditable="true">Python</td>
<td contenteditable="true">DBMS</td>
<td contenteditable="true">Math</td>
<td contenteditable="true">English</td>
<td contenteditable="true">Sports</td>
</tr>

<tr>
<td contenteditable="true">Wednesday</td>
<td contenteditable="true">Science</td>
<td contenteditable="true">Math</td>
<td contenteditable="true">AI</td>
<td contenteditable="true">Python</td>
<td contenteditable="true">Library</td>
</tr>

<tr>
<td contenteditable="true">Thursday</td>
<td contenteditable="true">DBMS</td>
<td contenteditable="true">English</td>
<td contenteditable="true">Lab</td>
<td contenteditable="true">Math</td>
<td contenteditable="true">Sports</td>
</tr>

<tr>
<td contenteditable="true">Friday</td>
<td contenteditable="true">AI</td>
<td contenteditable="true">Science</td>
<td contenteditable="true">Python</td>
<td contenteditable="true">Seminar</td>
<td contenteditable="true">Library</td>
</tr>

</table>

</div>

</div>

<script>

window.onload=function(){
let data=localStorage.getItem("tableData");
if(data){
document.getElementById("timetable").innerHTML=data;
}
}

function saveTable(){
localStorage.setItem("tableData",
document.getElementById("timetable").innerHTML);
alert("Timetable Saved!");
}

function addRow(){

let table=document.getElementById("timetable");

let row=table.insertRow();

for(let i=0;i<6;i++){

let cell=row.insertCell(i);

cell.contentEditable="true";

if(i==0)
cell.innerHTML="New Day";
else
cell.innerHTML="-";

}

}

function deleteRow(){

let table=document.getElementById("timetable");

if(table.rows.length>2)
table.deleteRow(table.rows.length-1);

}

function resetTable(){

localStorage.removeItem("tableData");

location.reload();

}

</script>

</body>
</html>
